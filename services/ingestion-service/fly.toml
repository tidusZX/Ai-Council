app = "shaq-os-ingestion"
primary_region = "sin"

[build]
  # Dockerfile + build context are supplied via CLI flags on `fly deploy`
  # because we need the build context to be the monorepo root (above this
  # fly.toml), and fly.toml's `dockerfile` path is resolved relative to
  # itself which would double-nest. See scripts/deploy-fly.sh.

[env]
  NODE_ENV = "production"
  PORT = "3001"
  INGESTION_TMP_DIR = "/tmp/shaq-os/ingestion"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
